<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Assistant</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.card{border:0;box-shadow:0 3px 18px #17255410}.brand{font-weight:700;color:#253b80}</style></head><body><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand brand" href="/">Knowledge Assistant</a>{% if user.is_authenticated %}<a href="/logout/" class="btn btn-outline-secondary btn-sm">Logout</a>{% endif %}</div></nav><main class="container py-4">{% for message in messages %}<div class="alert alert-info">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
