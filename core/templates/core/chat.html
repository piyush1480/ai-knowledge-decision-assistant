<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{org_name}} Assistant</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.chat{max-width:720px;margin:25px auto;background:white;border-radius:16px;padding:22px;box-shadow:0 4px 22px #0001}.bubble{padding:12px 15px;border-radius:12px;margin:10px 0;white-space:pre-wrap}.user{background:#e8efff;margin-left:15%}.bot{background:#f0f2f5;margin-right:10%}</style></head><body><div class="chat"><h4>{{org_name}} Assistant</h4><p class="text-muted">Ask a question about this organization's documents.</p><div id="messages"><div class="bubble bot">Hello! How can I help you?</div></div><form id="ask" class="d-flex gap-2"><input id="q" class="form-control" placeholder="Ask a question..." required><button class="btn btn-primary">Send</button></form></div><script>
const token='{{token}}';const messages=document.getElementById('messages');document.getElementById('ask').addEventListener('submit',async e=>{e.preventDefault();let q=document.getElementById('q').value.trim();if(!q)return;messages.innerHTML+=`<div class="bubble user"></div>`;messages.lastElementChild.textContent=q;document.getElementById('q').value='';let wait=document.createElement('div');wait.className='bubble bot';wait.textContent='Thinking…';messages.appendChild(wait);try{let r=await fetch('/api/ask/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,question:q})});let data=await r.json();wait.textContent=data.answer||data.error||'Unable to answer.';if(data.references?.length){let refs=data.references.map(x=>`${x.document} — Page ${x.page}`).join('\n');wait.textContent+='\n\nSources:\n'+refs;}}catch(err){wait.textContent='The assistant is temporarily unavailable.';}});
</script></body></html>
